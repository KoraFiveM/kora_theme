name: Documentation Issue
description: Report missing, outdated or unclear documentation for kora_theme.
title: '[Docs]: '
labels:
- documentation
- needs-triage
body:
- type: input
  id: page
  attributes:
    label: Documentation page or file
    placeholder: URL or path in kora_theme
  validations:
    required: true
- type: textarea
  id: issue
  attributes:
    label: What is wrong or missing?
    description: Name the area that needs clarification, such as Theme styles, Browser components, Live refresh bridge, Resource
      integration.
  validations:
    required: true
- type: textarea
  id: correction
  attributes:
    label: Suggested correction
